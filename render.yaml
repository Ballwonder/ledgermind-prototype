services:
  - type: web
    name: ledgermind-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: ledgermind-prototype-db
          property: connectionString
      - key: APP_ENV
        value: prototype
      - key: ENABLE_LIVE_FINANCIAL_CONNECTORS
        value: "false"
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: ledgermind-prototype-db
    plan: free
    databaseName: ledgermind
    user: ledgermind
